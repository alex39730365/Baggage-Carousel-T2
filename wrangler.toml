name = "baggage-proxy"
main = "workers/baggage-proxy.ts"
compatibility_date = "2024-09-23"

# 배포 후 실제 워커 주소는 다음과 같은 형태입니다:
#   https://baggage-proxy.<your-subdomain>.workers.dev
# 이 주소를 프론트엔드의 VITE_WORKER_API_URL 환경변수에 설정하세요.

[vars]
# 운영 환경에서는 `wrangler secret put SERVICE_KEY` 로 값을 설정해 시크릿으로 관리하는 것을 권장합니다.
# vars에 두는 것은 데모/로컬 용도입니다.
# 주의: `getBaggageArrivals`는 존재하지 않는 엔드포인트입니다. 실제 서비스 중인 엔드포인트는
# `getFltArrivalsBaggageClaimDesk`(api/baggage-arrivals.ts의 Vercel 함수와 동일)입니다.
UPSTREAM_BASE_URL = "https://apis.data.go.kr/B551177/statusOfBaggageClaimDesk/getFltArrivalsBaggageClaimDesk"
